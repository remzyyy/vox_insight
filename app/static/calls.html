<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recorded Calls — VoxInsight</title>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/"><span class="dot"></span> VoxInsight</a>
  <div class="links">
    <a href="/">Home</a><a href="/q1">Q1 · Voice Agent</a>
    <a href="/q2">Q2 · Knowledge Base</a><a href="/q3">Q3 · Native Bots</a>
    <a href="/q4">Q4 · Live Nudges</a><a href="/calls" class="active">Recorded Calls</a>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">Recorded Test Calls</h1>
  <p class="page-sub">Real Vapi voice calls for Q1 (business loan) and Q3 (Philippines Taglish + Indonesia Bahasa). Click a call to play the audio and read its transcript.</p>

  <div class="split">
    <div class="panel">
      <h2>Calls</h2>
      <div id="list" class="log" style="max-height:none"></div>
    </div>
    <div class="panel">
      <h2 id="detailTitle">Select a call</h2>
      <div id="player"></div>
      <div id="transcript" class="log" style="max-height:520px;white-space:pre-wrap;font-size:13px;color:var(--muted)"></div>
    </div>
  </div>
</div>

<script>
 async function load(){
   const d = await fetch('/api/calls').then(r=>r.json());
   const box = document.getElementById('list');
   box.innerHTML = d.calls.map(c=>(
     '<div class="bubble bot" style="cursor:pointer" onclick="open_call(\''+c.id+'\',\''+c.title.replace(/'/g,"")+'\')">'+
     '<b>'+c.title+'</b>'+
     '<div class="meta" style="color:var(--muted);font-size:11px;margin-top:4px">'+
     (c.has_audio?'🔊 audio':'⚠ no audio')+' · '+(c.has_transcript?'📄 transcript':'⚠ no transcript')+'</div></div>'
   )).join('');
 }
 async function open_call(cid, title){
   document.getElementById('detailTitle').textContent = title;
   document.getElementById('player').innerHTML =
     '<audio controls style="width:100%;margin:10px 0" src="/api/calls/'+cid+'/audio"></audio>';
   const t = await fetch('/api/calls/'+cid+'/transcript').then(r=>r.json());
   document.getElementById('transcript').textContent = t.markdown || t.error || '';
 }
 load();
</script>
</body>
</html>
